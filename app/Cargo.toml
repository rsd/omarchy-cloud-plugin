[package]
name = "omarchy-cloud"
version = "0.3.6"
edition = "2024"
description = "Keyboard-driven TUI to manage rclone mounts, offline folders and backups on Omarchy"
license = "MIT"
publish = false

[dependencies]
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "layout-cache"] }
zeroize = "1.9.1"
libc = "0.2.191"

[profile.release]
strip = true
lto = "thin"
