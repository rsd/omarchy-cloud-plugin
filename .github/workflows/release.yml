# Builds the static x86_64 omarchy-cloud binary for a release tag and commits
# it to main under dist/, where install.sh finds it (dist/BUILD-INFO names the
# version, commit, app source digest, rustc and target it was built from):
#
#   git tag v0.3.2 && git push origin v0.3.2
#
# The tag must equal app/Cargo.toml's and manifest.json's version, and must
# be on main; main must not have changed app/ since the tag (the binary would
# not match main's source). Any of these failing stops the run before a push.
#
# Two jobs, so that the build (which runs the dependencies' build scripts)
# never holds a token that can write: `build` has a read-only token, does not
# keep it in the checkout, and hands dist/ over as an artifact; `publish` runs
# no cargo and no repository code, checks the artifact and pushes it to main.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build (e.g. v0.3.2)"
        required: true

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: bash # bash --noprofile --norc -eo pipefail

env:
  RUST_TOOLCHAIN: "1.99.1"
  TARGET: x86_64-unknown-linux-musl
  BIN: omarchy-cloud-x86_64-linux-musl
  ARTIFACT: dist

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      commit: ${{ steps.dist.outputs.commit }}
    steps:
      - name: Resolve the tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag=${INPUT_TAG:-$GITHUB_REF_NAME}
          if ! [[ $tag =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$tag' is not a release tag (vX.Y.Z)"
            exit 1
          fi
          echo "TAG=$tag" >>"$GITHUB_ENV"
          echo "tag=$tag" >>"$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false

      - name: Check the versions
        run: |
          want=${TAG#v}
          cargo_v=$(sed -n '/^\[package\]/,/^\[/s/^version *= *"\([^"]*\)".*/\1/p' app/Cargo.toml | head -n 1)
          manifest_v=$(jq -r .version manifest.json)
          echo "tag $want, app/Cargo.toml $cargo_v, manifest.json $manifest_v"
          if [[ $cargo_v != "$want" || $manifest_v != "$want" ]]; then
            echo "::error::tag $TAG does not match app/Cargo.toml ($cargo_v) and manifest.json ($manifest_v)"
            exit 1
          fi

      # The digest install.sh recomputes (its src_sha256): the same pipeline,
      # character for character (tests/install-test.sh checks that they
      # agree), taken from the tagged sources before the build.
      - name: Digest the app sources
        run: |
          src=$({ echo app/Cargo.toml; echo app/Cargo.lock; find app/src -type f -name '*.rs'; } | LC_ALL=C sort | xargs -d '\n' sha256sum -- | sha256sum)
          src=${src%% *}
          [[ $src =~ ^[0-9a-f]{64}$ ]] || { echo "::error::could not digest the app sources"; exit 1; }
          echo "src_sha256 $src"
          echo "SRC_SHA256=$src" >>"$GITHUB_ENV"

      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target "$TARGET"
          rustup default "$RUST_TOOLCHAIN"
          rustc --version
          cargo --version

      - name: Build
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/target
        run: cargo build --release --locked --target "$TARGET" --manifest-path app/Cargo.toml

      - name: Check that the binary is static
        env:
          OUT: ${{ runner.temp }}/target/x86_64-unknown-linux-musl/release/omarchy-cloud
        run: |
          info=$(file -b "$OUT")
          echo "$info"
          if [[ $info != *"statically linked"* && $info != *"static-pie linked"* ]]; then
            echo "::error::the binary is not statically linked: $info"
            exit 1
          fi
          if [[ $info != *x86-64* ]]; then
            echo "::error::the binary is not x86-64: $info"
            exit 1
          fi

      - name: Stage dist/
        id: dist
        env:
          OUT: ${{ runner.temp }}/target/x86_64-unknown-linux-musl/release/omarchy-cloud
          STAGE: ${{ runner.temp }}/dist
        run: |
          commit=$(git rev-parse HEAD)
          mkdir -p "$STAGE"
          install -m 755 "$OUT" "$STAGE/$BIN"
          (cd "$STAGE" && sha256sum "$BIN" >"$BIN.sha256")
          {
            echo "version=${TAG#v}"
            echo "commit=$commit"
            echo "src_sha256=$SRC_SHA256"
            echo "rustc=$(rustc --version)"
            echo "target=$TARGET"
          } >"$STAGE/BUILD-INFO"
          cat "$STAGE/BUILD-INFO" "$STAGE/$BIN.sha256"
          echo "commit=$commit" >>"$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.ARTIFACT }}
          path: ${{ runner.temp }}/dist/
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      TAG: ${{ needs.build.outputs.tag }}
      BUILT: ${{ needs.build.outputs.commit }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ env.ARTIFACT }}
          path: ${{ runner.temp }}/dist

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Check the tag, main and the artifact
        env:
          STAGE: ${{ runner.temp }}/dist
        run: |
          tagged=$(git rev-parse "refs/tags/$TAG^{commit}")
          if [[ $tagged != "$BUILT" ]]; then
            echo "::error::$TAG is now $tagged, the build was of $BUILT; rerun the workflow"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$tagged" HEAD; then
            echo "::error::$TAG ($tagged) is not on main; tag a commit of main"
            exit 1
          fi
          if ! git diff --quiet "$tagged" HEAD -- app; then
            echo "::error::main changed app/ since $TAG; the binary would not match main's source. Tag main's HEAD with a new version"
            exit 1
          fi
          # Exactly the three files, consistent with each other and with main.
          names=$(cd "$STAGE" && find . -mindepth 1 -printf '%P\n' | LC_ALL=C sort | paste -sd ' ' -)
          if [[ $names != "BUILD-INFO $BIN $BIN.sha256" ]]; then
            echo "::error::unexpected artifact contents: $names"
            exit 1
          fi
          (cd "$STAGE" && sha256sum --check --strict -- "$BIN.sha256")
          src=$({ echo app/Cargo.toml; echo app/Cargo.lock; find app/src -type f -name '*.rs'; } | LC_ALL=C sort | xargs -d '\n' sha256sum -- | sha256sum)
          src=${src%% *}
          for want in "version=${TAG#v}" "commit=$tagged" "src_sha256=$src"; do
            if ! grep -qxF -- "$want" "$STAGE/BUILD-INFO"; then
              echo "::error::BUILD-INFO does not say $want"
              exit 1
            fi
          done

      # The artifact does not keep file modes; dist/ gets them here.
      - name: Commit dist/ to main
        env:
          STAGE: ${{ runner.temp }}/dist
        run: |
          rm -rf dist
          mkdir dist
          cp "$STAGE/$BIN" "$STAGE/$BIN.sha256" "$STAGE/BUILD-INFO" dist/
          chmod 755 "dist/$BIN"
          chmod 644 "dist/$BIN.sha256" dist/BUILD-INFO
          git add dist
          if git diff --cached --quiet; then
            echo "dist/ on main is already this build"
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "dist: omarchy-cloud $TAG (x86_64 musl)"
          if ! git push origin HEAD:main; then
            echo "::error::main moved while this ran; rerun the workflow for $TAG"
            exit 1
          fi
